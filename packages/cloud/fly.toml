# Deploy from the repo root:
#   flyctl deploy -c packages/cloud/fly.toml --dockerfile packages/cloud/Dockerfile .
#
# One-time setup:
#   flyctl apps create thoughts-cloud
#   flyctl secrets set DATABASE_URL=... SUDO_JWT_SECRET=... OPENAI_API_KEY=...
# DATABASE_URL points at a Neon Postgres database with the pgvector extension
# available (Neon supports CREATE EXTENSION vector out of the box).

app = "thoughts-cloud"
primary_region = "sjc" # pick the same region as the Neon database

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on so the phone can reach it at any time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
