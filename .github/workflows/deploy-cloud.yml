name: Deploy cloud service

on:
  push:
    branches: [main]
    paths:
      - "packages/cloud/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloud.yml"

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @thoughts/cloud...

      - name: Typecheck
        run: pnpm --filter @thoughts/cloud typecheck

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy -c packages/cloud/fly.toml --dockerfile packages/cloud/Dockerfile --remote-only .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
