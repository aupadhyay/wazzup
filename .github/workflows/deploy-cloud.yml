name: Deploy cloud service

on:
  push:
    branches: [main]
    paths:
      - "packages/cloud/**"
      - "packages/db/**"
      - "infra/deploy/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloud.yml"

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thoughts-cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @thoughts/cloud...

      - name: Typecheck
        run: pnpm --filter @thoughts/cloud typecheck

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cloud/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sync compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/deploy/docker-compose.yml,infra/deploy/Caddyfile"
          target: /opt/thoughts
          strip_components: 2

      - name: Roll the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/thoughts
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
