# The whole cloud deployment: app + Postgres (pgvector) + Caddy TLS + nightly
# backups. Lives at /opt/thoughts on the server; the deploy workflow syncs
# this directory and runs `docker compose up -d`.
#
# Server-side one-time setup: create /opt/thoughts/.env with
#   DOMAIN=thoughts.example.com
#   POSTGRES_PASSWORD=<random>
#   SUDO_JWT_SECRET=<random>
#   OPENAI_API_KEY=<key>
#   IMAGE=ghcr.io/<owner>/thoughts-cloud:latest

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://thoughts:${POSTGRES_PASSWORD}@postgres:5432/thoughts
      SUDO_JWT_SECRET: ${SUDO_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: thoughts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thoughts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoughts -d thoughts"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump with rotation, written to /opt/thoughts/backups on the
  # host. Sync that directory offsite (rclone to R2/B2/S3) for disaster
  # recovery — see README.md.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: thoughts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thoughts
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:
